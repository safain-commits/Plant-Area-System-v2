name: plant-area-v2
x-runtime: &runtime
  restart: unless-stopped
  init: true
  networks: [private]
  environment: &app-env
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    AUTH_INTERNAL_URL: http://auth:3000
    CONSUMABLES_INTERNAL_URL: http://consumables:3000
    SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN}
    NODE_ENV: production
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 8s
    retries: 3
    start_period: 30s
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      BAG_DB_PASSWORD: ${BAG_DB_PASSWORD:?Set BAG_DB_PASSWORD}
      CONSUMABLES_DB_PASSWORD: ${CONSUMABLES_DB_PASSWORD:?Set CONSUMABLES_DB_PASSWORD}
    command:
      [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --default-time-zone=+00:00]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sh:/docker-entrypoint-initdb.d/01-plant.sh:ro
    networks: [private]
    healthcheck:
      # The initialization server only exposes a socket; require the final TCP
      # server and both databases before migrations or dependent apps can start.
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uroot --silent --execute="USE plant_auth; USE plant_bag_filter; SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile, target: tools }
    image: plant-tools:${RELEASE_TAG:-local}
    command: [db:migrate]
    environment: &db-tools-env
      AUTH_DATABASE_URL: mysql://plant_auth:${AUTH_DB_PASSWORD}@mysql:3306/plant_auth
      BAG_DATABASE_URL: mysql://plant_bag:${BAG_DB_PASSWORD}@mysql:3306/plant_bag_filter
      CONSUMABLES_DATABASE_URL: mysql://plant_consumables:${CONSUMABLES_DB_PASSWORD}@mysql:3306/plant_consumables
      CONSUMABLES_MIGRATION_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/plant_consumables
      AUTH_MIGRATION_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/plant_auth
      BAG_MIGRATION_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/plant_bag_filter
    networks: [private]
    depends_on: { mysql: { condition: service_healthy } }
  bootstrap:
    image: plant-tools:${RELEASE_TAG:-local}
    profiles: [setup]
    command: [bootstrap]
    environment:
      <<: *db-tools-env
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-Admin Portal}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    networks: [private]
    depends_on: { migrate: { condition: service_completed_successfully } }
  auth:
    <<: *runtime
    build: { context: ., dockerfile: infra/Dockerfile, args: { APP: auth } }
    image: plant-auth:${RELEASE_TAG:-local}
    environment:
      <<: *app-env
      AUTH_DATABASE_URL: mysql://plant_auth:${AUTH_DB_PASSWORD}@mysql:3306/plant_auth
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/auth/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  portal:
    <<: *runtime
    build: { context: ., dockerfile: infra/Dockerfile, args: { APP: portal } }
    image: plant-portal:${RELEASE_TAG:-local}
    depends_on: { auth: { condition: service_healthy } }
  bag-filter:
    <<: *runtime
    build: { context: ., dockerfile: infra/Dockerfile, args: { APP: bag-filter } }
    image: plant-bag-filter:${RELEASE_TAG:-local}
    environment:
      <<: *app-env
      BAG_DATABASE_URL: mysql://plant_bag:${BAG_DB_PASSWORD}@mysql:3306/plant_bag_filter
    depends_on:
      { auth: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/bag-filter/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  consumables:
    <<: *runtime
    build: { context: ., dockerfile: infra/Dockerfile, args: { APP: consumables } }
    image: plant-consumables:${RELEASE_TAG:-local}
    environment:
      <<: *app-env
      CONSUMABLES_DATABASE_URL: mysql://plant_consumables:${CONSUMABLES_DB_PASSWORD}@mysql:3306/plant_consumables
    depends_on:
      { auth: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/consumables/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      NGINX_ENVSUBST_FILTER: ^(SERVICE_TOKEN|PUBLIC_ORIGIN)$
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/proxy.conf:/etc/nginx/plant-proxy.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    networks: [private, gateway]
    depends_on:
      {
        auth: { condition: service_healthy },
        portal: { condition: service_healthy },
        bag-filter: { condition: service_healthy },
        consumables: { condition: service_healthy },
      }
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: [bash, /scripts/backup.sh]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: mysql
    volumes: ['./infra/mysql/backup.sh:/scripts/backup.sh:ro', './backups:/backups']
    networks: [private]
    depends_on: { mysql: { condition: service_healthy } }
networks:
  gateway: {}
  private:
    internal: true
volumes:
  mysql-data:
