# Host Nginx owns public 80/443. Project Nginx remains on loopback HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tq-cmms.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://tq-cmms.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tq-cmms.com;

    ssl_certificate /etc/letsencrypt/live/tq-cmms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tq-cmms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;

    access_log /var/log/nginx/tq-cmms.access.log;
    error_log /var/log/nginx/tq-cmms.error.log warn;

    location / {
        # Only this application's maintenance flag affects this vhost.
        if (-f /var/lib/tq-cmms/maintenance) { return 503; }

        # No URI suffix: preserve /auth, /bag-filter and /consumables prefixes.
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/tq-cmms/backend.crt;
        proxy_ssl_name tq-cmms.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite incoming client-supplied forwarding/identity headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Plant-Service-Token '';
        proxy_set_header X-Plant-App '';
        proxy_set_header X-User-Id '';
        proxy_set_header X-User-Role '';
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
