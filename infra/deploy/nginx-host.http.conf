# Initial HTTP-only vhost. Never replace nginx.conf or another site's vhost.
server {
    listen 80;
    listen [::]:80;
    server_name tq-cmms.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 'TQ CMMS: deployment preparation in progress.\n';
    }
}
