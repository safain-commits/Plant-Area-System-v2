name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Prepare isolated MySQL
        run: |
          node --import tsx scripts/prepare-test.ts
          docker compose --env-file .test-runtime/stack.env -p plant-v2-test -f compose.yaml -f .test-runtime/compose.yaml up -d --wait mysql
          node --env-file=.test-runtime/host.env --import tsx scripts/migrate.ts
          node --env-file=.test-runtime/host.env --import tsx scripts/bootstrap.ts
      - name: MySQL integration tests
        run: node --env-file=.test-runtime/host.env --import tsx --test --test-concurrency=1 tests/integration/*.test.ts
      - name: Build independent containers and start HTTPS gateway
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout infra/certs/tls.key -out infra/certs/tls.crt -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost,IP:127.0.0.1
          docker compose --env-file .test-runtime/stack.env -p plant-v2-test -f compose.yaml -f .test-runtime/compose.yaml up -d --build --wait nginx backup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node --env-file=.test-runtime/host.env --import tsx scripts/test-operations.ts
      - name: Gateway recovery after application IP changes
        run: node --env-file=.test-runtime/host.env --import tsx scripts/test-gateway-recovery.ts
      - name: Diagnose failed test stack
        if: failure()
        run: |
          if [ -f .test-runtime/stack.env ]; then
            docker compose --env-file .test-runtime/stack.env -p plant-v2-test -f compose.yaml -f .test-runtime/compose.yaml ps -a
            docker compose --env-file .test-runtime/stack.env -p plant-v2-test -f compose.yaml -f .test-runtime/compose.yaml logs --no-color --tail=160 mysql auth portal bag-filter consumables nginx
          fi
      - name: Stop test stack
        if: always()
        run: |
          if [ -f .test-runtime/stack.env ]; then
            docker compose --env-file .test-runtime/stack.env -p plant-v2-test -f compose.yaml -f .test-runtime/compose.yaml down
          fi
